name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  godot-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import resources
        working-directory: Godot Project V4/NinjaAdventure
        run: godot --headless --path . --import

      - name: Script compile check (must be zero errors)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          godot --headless --editor --quit --path . 2>&1 | tee compile.log
          if grep -iE "SCRIPT ERROR|Parse Error|Failed to load script" compile.log; then
            echo "Script compile errors found"
            exit 1
          fi
          echo "Compile check passed"

      - name: Main scene smoke test (30 frames)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          godot --headless --path . --quit-after 30 2>&1 | tee smoke.log
          if grep -iE "SCRIPT ERROR" smoke.log; then
            echo "Runtime script errors found"
            exit 1
          fi
          echo "Smoke test passed"

      - name: Contract audits (Python, data/asset consistency)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          # 契约审计：过期门禁已在本轮删除或重写为「跟随代码当前位置」的版本
          # （audit_release_v15 / audit_feedback_v152 / audit_audio_*_v154 已删；
          #  audit_feedback_audio / validate_settlement_pack / validate_ui_pack 为重写版）。
          # audit_art_pass_v16 需要 Pillow，未纳入门禁。
          set -e
          for a in audit_settings.py audit_events.py audit_debug_qa.py audit_audio.py \
                   audit_balance_v15_1.py audit_cat_meow_v158.py audit_input.py \
                   audit_grid_alignment.py audit_feedback_audio.py \
                   validate_settlement_pack.py validate_ui_pack.py count_events.py; do
            echo "== $a =="
            python "tools/$a"
          done

      - name: 12-level regression (each level 90 frames, zero script errors)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          LEVELS="
          scenes/levels/ch01_village/L01_first_job.tscn
          scenes/levels/ch01_village/L02_same_old_trap.tscn
          scenes/levels/ch01_village/L03_who_is_watching.tscn
          scenes/levels/ch01_village/L04_village_accident.tscn
          scenes/levels/ch02_dock/L05_moonlit_dock.tscn
          scenes/levels/ch02_dock/L06_dog_ally.tscn
          scenes/levels/ch02_dock/L07_who_goes_first.tscn
          scenes/levels/ch02_dock/L08_last_boat.tscn
          scenes/levels/ch03_castle/L09_storm_night.tscn
          scenes/levels/ch03_castle/L10_dont_touch_dynamite.tscn
          scenes/levels/ch03_castle/L11_busy_gate.tscn
          scenes/levels/ch03_castle/L12_gatekeeper_boss.tscn
          "
          FAILED=0
          for level in $LEVELS; do
            # 场景参数必须是 res:// 资源路径；裸相对路径不是合法的场景定位方式。
            godot --headless --path . "res://$level" --quit-after 90 > level.log 2>&1
            if grep -iE "SCRIPT ERROR|Parse Error" level.log; then
              echo "LEVEL FAIL: $level"
              FAILED=1
            else
              echo "LEVEL PASS: $level"
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "Level regression failed"
            exit 1
          fi
          echo "12-level regression passed"

      - name: Runtime behavior test (rebind persistence / device scoping / fish save)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          godot --headless --path . res://tools/runtime_behavior_test.tscn 2>&1 | tee runtime.log
          if grep -iE "SCRIPT ERROR|Parse Error" runtime.log; then
            echo "Runtime script errors found"; exit 1
          fi
          grep -q "RUNTIME: PASS" runtime.log || {
            echo "Runtime behavior assertions failed"; grep -A20 "RUNTIME: FAIL" runtime.log; exit 1; }
          echo "Runtime behavior test passed"

      - name: Player-behavior regression (real input: move/interact, 12 levels)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          godot --headless --fixed-fps 60 --path . res://tools/player_behavior_regression.tscn 2>&1 | tee player.log
          if grep -iE "SCRIPT ERROR" player.log; then
            echo "Runtime script errors found"
            exit 1
          fi
          if grep -q "PLAYER_BEHAVIOR: .* FAIL" player.log; then
            echo "Player-behavior regression failed"
            exit 1
          fi
          grep -q "PLAYER_BEHAVIOR: move=12/12 action=12/12" player.log || {
            echo "Player-behavior summary mismatch"; exit 1; }
          echo "Player-behavior regression passed"

      - name: 12-level gameplay regression (auto-play, zero script errors)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          godot --headless --fixed-fps 60 --path . res://tools/gameplay_regression.tscn 2>&1 | tee gameplay.log
          if grep -iE "SCRIPT ERROR" gameplay.log; then
            echo "Runtime script errors found"
            exit 1
          fi
          if ! grep -q "REGRESSION: 12/12" gameplay.log; then
            echo "Gameplay regression failed"
            exit 1
          fi
          echo "Gameplay regression passed"
