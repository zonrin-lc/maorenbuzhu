name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  godot-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import resources
        working-directory: Godot Project V4/NinjaAdventure
        run: godot --headless --path . --import

      - name: Script compile check (must be zero errors)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          godot --headless --editor --quit --path . 2>&1 | tee compile.log
          if grep -iE "SCRIPT ERROR|Parse Error|Failed to load script" compile.log; then
            echo "Script compile errors found"
            exit 1
          fi
          echo "Compile check passed"

      - name: Main scene smoke test (30 frames)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          godot --headless --path . --quit-after 30 2>&1 | tee smoke.log
          if grep -iE "SCRIPT ERROR" smoke.log; then
            echo "Runtime script errors found"
            exit 1
          fi
          echo "Smoke test passed"

      - name: 12-level regression (each level 90 frames, zero script errors)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          LEVELS="
          scenes/levels/ch01_village/L01_first_job.tscn
          scenes/levels/ch01_village/L02_same_old_trap.tscn
          scenes/levels/ch01_village/L03_who_is_watching.tscn
          scenes/levels/ch01_village/L04_village_accident.tscn
          scenes/levels/ch02_dock/L05_moonlit_dock.tscn
          scenes/levels/ch02_dock/L06_dog_ally.tscn
          scenes/levels/ch02_dock/L07_who_goes_first.tscn
          scenes/levels/ch02_dock/L08_last_boat.tscn
          scenes/levels/ch03_castle/L09_storm_night.tscn
          scenes/levels/ch03_castle/L10_dont_touch_dynamite.tscn
          scenes/levels/ch03_castle/L11_busy_gate.tscn
          scenes/levels/ch03_castle/L12_gatekeeper_boss.tscn
          "
          FAILED=0
          for level in $LEVELS; do
            godot --headless --path . "$level" --quit-after 90 > level.log 2>&1
            if grep -iE "SCRIPT ERROR|Parse Error" level.log; then
              echo "LEVEL FAIL: $level"
              FAILED=1
            else
              echo "LEVEL PASS: $level"
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "Level regression failed"
            exit 1
          fi
          echo "12-level regression passed"

      - name: 12-level gameplay regression (auto-play, zero script errors)
        working-directory: Godot Project V4/NinjaAdventure
        shell: bash
        run: |
          godot --headless --fixed-fps 60 --path . tools/gameplay_regression.tscn 2>&1 | tee gameplay.log
          if grep -iE "SCRIPT ERROR" gameplay.log; then
            echo "Runtime script errors found"
            exit 1
          fi
          if ! grep -q "REGRESSION: 12/12" gameplay.log; then
            echo "Gameplay regression failed"
            exit 1
          fi
          echo "Gameplay regression passed"
