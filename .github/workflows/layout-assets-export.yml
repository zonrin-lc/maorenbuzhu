name: Temporary Asset Export

on:
  push:
    branches: [tmp-layout-assets-export]

jobs:
  export-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Package Ninja Adventure assets
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/layout_assets
          cp -r "Ninja Adventure - Asset Pack/Backgrounds/Tilesets" /tmp/layout_assets/
          cp -r "Ninja Adventure - Asset Pack/Backgrounds/Vehicles" /tmp/layout_assets/
          cp -r "Ninja Adventure - Asset Pack/Backgrounds/Animated" /tmp/layout_assets/
          mkdir -p /tmp/layout_assets/Actor/Animal /tmp/layout_assets/Actor/Character
          cp -r "Ninja Adventure - Asset Pack/Actor/Animal/Cat" /tmp/layout_assets/Actor/Animal/
          cp -r "Ninja Adventure - Asset Pack/Actor/Animal/CatBlack" /tmp/layout_assets/Actor/Animal/
          cp -r "Ninja Adventure - Asset Pack/Actor/Animal/CatOrange" /tmp/layout_assets/Actor/Animal/
          cp -r "Ninja Adventure - Asset Pack/Actor/Animal/CatWhite" /tmp/layout_assets/Actor/Animal/
          cp -r "Ninja Adventure - Asset Pack/Actor/Animal/CatCyclop" /tmp/layout_assets/Actor/Animal/
          cp -r "Ninja Adventure - Asset Pack/Actor/Animal/Dog" /tmp/layout_assets/Actor/Animal/
          cp -r "Ninja Adventure - Asset Pack/Actor/Character/NinjaBlue" /tmp/layout_assets/Actor/Character/
          cp -r "Ninja Adventure - Asset Pack/Actor/Character/SamuraiRed" /tmp/layout_assets/Actor/Character/
          cp -r "Ninja Adventure - Asset Pack/Actor/Character/SamuraiBlue" /tmp/layout_assets/Actor/Character/
          cp -r "Ninja Adventure - Asset Pack/Actor/Boss" /tmp/layout_assets/Actor/ 2>/dev/null || true
          mkdir -p /tmp/layout_assets/Items /tmp/layout_assets/FX
          cp -r "Ninja Adventure - Asset Pack/Items/Object" /tmp/layout_assets/Items/
          cp -r "Ninja Adventure - Asset Pack/Items/Food" /tmp/layout_assets/Items/ 2>/dev/null || true
          cp -r "Ninja Adventure - Asset Pack/Items/Potion" /tmp/layout_assets/Items/ 2>/dev/null || true
          cp -r "Ninja Adventure - Asset Pack/Items/Projectile" /tmp/layout_assets/Items/ 2>/dev/null || true
          cp -r "Ninja Adventure - Asset Pack/FX/Environment" /tmp/layout_assets/FX/ 2>/dev/null || true
          cp -r "Ninja Adventure - Asset Pack/FX/Elemental" /tmp/layout_assets/FX/ 2>/dev/null || true
          cd /tmp && zip -qr ninja_adventure_layout_assets.zip layout_assets
      - name: Upload asset pack
        uses: actions/upload-artifact@v4
        with:
          name: ninja-adventure-layout-assets
          path: /tmp/ninja_adventure_layout_assets.zip
          retention-days: 1
