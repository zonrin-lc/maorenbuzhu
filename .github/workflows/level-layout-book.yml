name: Level Layout Book

on:
  workflow_dispatch:
  push:
    paths:
      - 'Godot Project V4/NinjaAdventure/tools/layout_book_*.gd'
      - 'Godot Project V4/NinjaAdventure/tools/layout_book_manifest.gd'
      - '.github/workflows/level-layout-book.yml'
      - 'Godot Project V4/NinjaAdventure/data/routes/**'
      - 'Godot Project V4/NinjaAdventure/data/events/**'
      - 'Godot Project V4/NinjaAdventure/scenes/levels/**'
      - 'Godot Project V4/NinjaAdventure/assets/scene_art/**'
      - 'Godot Project V4/NinjaAdventure/assets/props/**'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Godot Project V4/NinjaAdventure'
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk xvfb

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-export-templates: false

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Render L01-L12
        shell: bash
        run: |
          set -e
          mkdir -p art/layout_book/rendered
          for level in L01 L02 L03 L04 L05 L06 L07 L08 L09 L10 L11 L12; do
            echo "Rendering $level"
            timeout 90s xvfb-run -a godot --resolution 1600x1000 --path . --scene res://tools/layout_book_renderer.tscn -- "$level"
          done

      - name: Validate render outputs
        run: |
          test "$(find art/layout_book/rendered -name '*_scene_layout.png' | wc -l)" -eq 12

      - name: Upload layout book pages
        uses: actions/upload-artifact@v4
        with:
          name: maorenbuzhu-level-layout-book
          path: 'Godot Project V4/NinjaAdventure/art/layout_book/rendered/*.png'
          retention-days: 14

      - name: Commit generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/layout_book/rendered/*.png
          if git diff --cached --quiet; then
            echo "No generated-page changes."
          else
            git commit -m "docs: regenerate 12 level scene layout pages [skip layout-book]"
            git pull --rebase origin main
            git push
          fi
